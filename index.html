<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>2D World</title>

<link rel="stylesheet" href="game.css">
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
    <div id="hpBox">
        <div id="playerHPBar"></div>
    </div>

    <div id="playerHPText">
        HP: 100 / 100
    </div>
</div>

<div id="message">
    Tier 1 Hell nearby...
</div><div id="joystick">
    <div id="stick"></div>
</div>

<button id="attackButton">
    ⚔️
</button>

<div id="gameOver">
    <h1>You Died</h1>
    <p>Refresh to try again.</p>
</div>

<div id="victory">
    HELL DEFEATED!
</div>

<script src="game.js"></script>

</body>
</html>
